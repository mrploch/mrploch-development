name: Feature request
description: Suggest a new capability or an improvement.
labels: [ "enhancement" ]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what makes it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behaviour you would like, ideally with a usage example.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
