# Publishes the results of the Build workflow: a "Test Results" check, and one sticky coverage comment per pull request.
#
# It runs on `workflow_run`, in the context of the default branch, so it has write access even when the build came
# from a fork or from Dependabot. It never checks out or executes code from the pull request: it only reads the
# artefacts the build uploaded, and validates the pull-request metadata in them before using it.
name: PR Report

on:
  workflow_run:
    workflows: [ "Build" ]
    types: [ completed ]

permissions: { }

jobs:
  test-results:
    name: Test results
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: write
      contents: read

    steps:
      - name: Publish test results
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          artifact: test-results
          name: Test Results
          path: "**/*.trx"
          reporter: dotnet-trx
          # Create the "Test Results" check run; the default writes only a job summary.
          use-actions-summary: "false"
          # A build that failed before running tests has no results; the Build check already reports that.
          fail-on-empty: false

  coverage-comment:
    name: Coverage comment
    if: ${{ github.event.workflow_run.event == 'pull_request' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Download coverage report
        id: download
        continue-on-error: true # A build that failed before testing uploads no report; the next step reports that.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-report
          path: coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      # The artefact was produced by pull-request code, so its contents are untrusted. The pull-request number is
      # accepted only if it is numeric and that pull request's head is exactly the commit, branch and repository
      # the build ran on, so a forged number cannot direct the comment at an unrelated pull request.
      - name: Validate pull request
        id: pr
        if: steps.download.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          if [ ! -f coverage/coverage-report/pr-number.txt ] || [ ! -f coverage/coverage-report/comment.md ]; then
            echo "::warning title=No coverage comment::The build uploaded no pull-request coverage summary."
            exit 0
          fi
          number=$(head -c 16 coverage/coverage-report/pr-number.txt | tr -d '[:space:]')
          if ! [[ "$number" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid pull-request number::Refusing to comment: '$number' is not a number."
            exit 1
          fi
          read -r head_sha head_branch head_repository < <(gh api "repos/${REPOSITORY}/pulls/${number}" \
            --jq '[.head.sha, .head.ref, .head.repo.full_name] | @tsv')
          if [ "$head_branch" != "$RUN_HEAD_BRANCH" ] || [ "$head_repository" != "$RUN_HEAD_REPOSITORY" ]; then
            echo "::error title=Mismatched pull request::Pull request #${number} is not the pull request this build ran for. Refusing to comment."
            exit 1
          fi
          if [ "$head_sha" != "$RUN_HEAD_SHA" ]; then
            echo "::warning title=Stale coverage report::Pull request #${number} has moved on to ${head_sha}; this report is for ${RUN_HEAD_SHA}. Skipping the comment."
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Report a missing coverage summary
        if: steps.download.outcome != 'success'
        run: echo "::warning title=No coverage report::The Build run uploaded no coverage report, so there is nothing to comment."

      - name: Post or update the coverage comment
        if: steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: coverage
          number: ${{ steps.pr.outputs.number }}
          path: coverage/coverage-report/comment.md
